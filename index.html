<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>TGC Field Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E7E1CA;
    --bg-panel:#F4F0E1;
    --forest:#26362B;
    --forest-dark:#182018;
    --brass:#B08D57;
    --brass-dark:#8C6B3B;
    --oxblood:#7B3B2E;
    --ink:#22261F;
    --ink-soft:#5B5E4F;
    --line:#C9C0A0;
    --good:#3E5C3A;
    --radius:10px;
    --shadow:0 2px 8px rgba(24,32,24,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(38,54,43,0.06) 1px, transparent 0);
    background-size:14px 14px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}

  .topbar{
    background:var(--forest);
    color:var(--bg-panel);
    padding:18px 18px 14px;
    border-bottom:3px solid var(--brass);
  }
  .topbar .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--brass);
    text-transform:uppercase;
  }
  .topbar h1{
    font-family:'Roboto Slab',serif;
    font-size:22px;
    margin:2px 0 0;
    font-weight:700;
    letter-spacing:0.01em;
  }

  main{flex:1;padding:16px 16px 90px;}

  .card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
  }
  .card h2{
    font-family:'Roboto Slab',serif;
    font-size:16px;
    margin:0 0 10px;
    color:var(--forest);
  }
  .muted{color:var(--ink-soft);font-size:13px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:10px 0 4px;text-transform:uppercase;letter-spacing:0.04em;}
  select,input[type=text],input[type=date]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  input:focus,select:focus,button:focus{outline:2px solid var(--brass);outline-offset:1px;}

  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:8px;
    padding:11px 16px;
    cursor:pointer;
    transition:transform .05s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.98);}
  button:disabled{opacity:0.45;cursor:not-allowed;}
  .btn-primary{background:var(--forest);color:#fff;}
  .btn-primary:hover:not(:disabled){background:var(--forest-dark);}
  .btn-brass{background:var(--brass);color:var(--forest-dark);}
  .btn-brass:hover:not(:disabled){background:var(--brass-dark);}
  .btn-ghost{background:transparent;color:var(--forest);border:1px solid var(--forest);}
  .btn-danger{background:transparent;color:var(--oxblood);border:1px solid var(--oxblood);}
  .btn-small{padding:7px 10px;font-size:12px;}
  .row{display:flex;gap:8px;align-items:center;}
  .row > *{flex:1;}
  .btn-row{display:flex;gap:8px;margin-top:12px;}

  .session-option{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--line);border-radius:8px;
    padding:12px;margin-bottom:8px;background:#fff;cursor:pointer;
  }
  .session-option.checked{border-color:var(--forest);background:#EFEBD9;}
  .session-option.locked{cursor:default;}
  .session-option.select-all{border:1.5px solid var(--brass);background:#F6EFE0;}
  .session-option.select-all.checked{background:#EFE1C4;}
  .weekend-group{margin-bottom:14px;}
  .weekend-group:last-child{margin-bottom:0;}
  .session-option input{width:18px;height:18px;}
  .session-option .meta{flex:1;}
  .session-option .sday{font-weight:600;font-size:14px;}
  .session-option .sdate{font-size:12px;color:var(--ink-soft);}
  .tag{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;
    padding:3px 7px;border-radius:20px;text-transform:uppercase;
  }
  .tag-open{background:#DCEBD9;color:var(--good);}
  .tag-drawn{background:#F1E4D2;color:var(--brass-dark);}
  .tag-locked{background:#EAD9D3;color:var(--oxblood);}

  .ticket{
    display:flex;align-items:center;gap:12px;
    background:#fff;border:1px dashed var(--line);border-radius:8px;
    padding:10px 12px;margin-bottom:8px;position:relative;
  }
  .ticket .num{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20px;
    color:var(--forest);min-width:34px;text-align:center;
    background:var(--bg);border-radius:6px;padding:6px 0;
  }
  .ticket .who{flex:1;min-width:0;}
  .ticket .who .nm{font-weight:600;font-size:14px;}
  .ticket .who .as{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .ticket.done{border-style:solid;border-color:var(--good);}
  .ticket .assign-controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;width:100%;}
  .ticket .assign-controls select{flex:1;min-width:100px;}

  .tabbar{
    position:sticky;bottom:0;left:0;right:0;
    display:flex;background:var(--forest);border-top:3px solid var(--brass);
    max-width:640px;margin:0 auto;
  }
  .tabbar button{
    flex:1;background:none;color:#C9CBBE;border-radius:0;padding:10px 4px 8px;
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.05em;text-transform:uppercase;
  }
  .tabbar button .ic{display:block;font-size:17px;margin-bottom:2px;}
  .tabbar button.active{color:#fff;background:var(--forest-dark);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);}
  th{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:0.05em;}

  .toast{
    position:fixed;bottom:78px;left:50%;transform:translateX(-50%);
    background:var(--forest-dark);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:13px;box-shadow:var(--shadow);z-index:50;max-width:90%;text-align:center;
  }
  .list-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .list-row:last-child{border-bottom:none;}
  .empty{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:14px;}
  .pin-gate{text-align:center;padding:40px 10px;}
  .pin-gate input{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:0.3em;max-width:180px;margin:14px auto;}
  a.linklike{color:var(--forest);font-weight:600;cursor:pointer;text-decoration:underline;font-size:13px;}
  .stat-box{display:flex;gap:10px;margin-bottom:4px;}
  .stat-box .s{flex:1;background:var(--bg);border-radius:8px;padding:10px;text-align:center;}
  .stat-box .s .n{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:var(--forest);}
  .stat-box .s .l{font-size:10px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:0.05em;}
  .badge-remove{background:var(--oxblood);color:#fff;border-radius:50%;width:22px;height:22px;padding:0;font-size:14px;line-height:1;}
  .section-divider{margin:22px 0 10px;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);border-bottom:1px solid var(--line);padding-bottom:4px;}
  .loading{text-align:center;padding:40px;color:var(--ink-soft);}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="eyebrow">Trelawny Gun Club</div>
    <h1 id="topTitle">Field Register</h1>
  </div>
  <main id="view"><div class="loading">Loading register…</div></main>
  <div class="tabbar">
    <button data-tab="register"><span class="ic">&#9998;</span>Register</button>
    <button data-tab="draw"><span class="ic">&#9856;</span>Draw</button>
    <button data-tab="results"><span class="ic">&#9776;</span>Results</button>
    <button data-tab="setup"><span class="ic">&#9881;</span>Setup</button>
  </div>
</div>

<script>
const JUNIOR_NAMES = new Set(["BICKNELL, BLAISE","BICKNELL, JACOB","BURROWES, JOSHUA","CLARK, JOSHUA WADE","DELAPHENA, DEMI","DESNOES, ALEXANDER","DESNOES, MARK ANTHONY","EDWARDS, JUDE","McCONNELL, Ella","MCCONNELL, KYLE","McCONNELL, Leo","McCONNELL, Liam","McCONNELL, Luke","MCKENZIE, ZACHARY","RAMSON, RYAN","RAMSON, SHANE","RAMSON,DOMINIC","REERIE, RAEGAN","ROBERTS, LUKE","WILDISH, William"]);
const SEED_ROSTER = ["BAUGH, NEIL","BAUGH, TYLER","BICKNELL, ADRIAN","BICKNELL, BLAISE","BICKNELL, BRUCE","BICKNELL, JACOB","BICKNELL, NICOLA","BURKE, PAUL","BURROWES, EARL STAFFORD","BURROWES, GREGORY","BURROWES, JOSHUA","CAMPBELL, MARK","CLARK, JOSHUA WADE","CLARK, MAXIM","CLARKE, BRIAN","CLARKE, ROBERT","DELAPHENA, DALE","DELAPHENA, DEMI","DESNOES, ALEXANDER","DESNOES, ANDREW","DESNOES, ANTHONY","DESNOES, JOHN","DESNOES, MARK ANTHONY","EDWARDS, ISAACS","EDWARDS, JUDE","EDWARDS, MARLON","FEANNY NICHOLAS","FRASER, RICHARD","GORE, PHILP","GOURZONG, GARY","GOURZONG, JOHNNY","GOURZONG, ZANE","GRAHAM, PETER DR.","GROVES, ANDREW","HENRIQUES, BARBARA","HENRIQUES, ROBERT","HOLLOWAY, GARTH","HOLLOWAY, GEORGE","HOPWOOD, ANDREW","HOPWOOD, MARTIN","HOSSMANN, SASCHA","JAMES, SAM SR.","JARDIM, BENJAMIN","JARDIM, ZAC","JOHNSON, GEORGE","JOHNSON, GEORGE JR.","LEVY, BELINDA","LEVY, LEICESTER","LEVY. SIMON","MCCONNELL, KYLE","MCCONNELL, STEPHANIE","MCCONNELL, TANIA","MCKENZIE, NEIL","MCKENZIE, ZACHARY","MILLER, ROBERT (BOBBY)","McCONNELL ,FRASER Sr","McCONNELL FRASER Jr.","McCONNELL, DAVID JR.","McCONNELL, Ella","McCONNELL, JEREMY","McCONNELL, Leo","McCONNELL, Liam","McCONNELL, Luke","McCONNELL, MARK","McCONNELL, PETER Jr.","McCONNELL, PETER Sr.","McCONNELL, STEPHEN","McCONNELL, STUART","McCONNELL, TOBY","McKENZIE, KURT","RAMSON, CHRISTOPHER","RAMSON, JOHN","RAMSON, PHILIP","RAMSON, RICHARD","RAMSON, RYAN","RAMSON, SHANE","RAMSON,DOMINIC","REERIE, RAEGAN","REERIE, RICHARD","ROBERTS, LUKE","RUSSELL, JASON","RUSSELL, ROBERT (ROBIN)","SHIRLEY, RICHARD","SIMPSON, AAN","SMITH, FRED","SMITH, LAITHON","TAVARES-FINSON, C.","TERRIER, BRUCE","TERRIER, RYAN","THERRIAN, JACOB","VAZ, ADAM","VAZ, DARYL","VERNON, RAMON","WILDISH, ANDREW","WILDISH, DREW","WILDISH, William","WRIGHT, ADRIAN"]
  .map(n => ({name:n, junior: JUNIOR_NAMES.has(n)}));
function isJuniorName(name){
  const m = state.roster.find(r=>r.name===name);
  return m ? !!m.junior : false;
}
const SEED_PROPERTIES = [{"name":"ARCADIA","stands":8},{"name":"BARRETT HALL","stands":22},{"name":"BELL","stands":11},{"name":"BIDHAM","stands":14},{"name":"BRYAN CASTLE","stands":14},{"name":"DOG","stands":13},{"name":"DUNDEE POOL","stands":15},{"name":"GARDEN PIECE","stands":7},{"name":"GAZA","stands":6},{"name":"GLIDDEN","stands":26},{"name":"GORE HILL","stands":6},{"name":"GREENSIDE","stands":14},{"name":"HYDE HALL","stands":10},{"name":"KENT","stands":12},{"name":"KIRKPATRICK","stands":30},{"name":"MANGO WALK","stands":13},{"name":"MARY TICKER","stands":9},{"name":"MCKENZIE LANDS, KIRKPATRICK","stands":10},{"name":"MIDLANDS","stands":10},{"name":"MOZAMBIQUE","stands":7},{"name":"MURRAY LANDS, KIRKPATRICK","stands":10},{"name":"NEW COURT","stands":8},{"name":"NEW GREENSIDE","stands":14},{"name":"NEW KIRKPATRICK","stands":30},{"name":"ORANGE GROVE","stands":8},{"name":"PARK PEN, KIRKPATRICK","stands":10},{"name":"PEMBROKE","stands":6},{"name":"POWER LINE","stands":13},{"name":"ROSLYN CASTLE","stands":9},{"name":"ROSYLN POND","stands":8},{"name":"SCHAWFIELD","stands":15},{"name":"SCOTTS LANDS","stands":10},{"name":"SMITH  & BELL","stands":11},{"name":"THATCH WALK","stands":10},{"name":"WHITE BAY","stands":7}];
const DAY_TYPES = [
  {key:"SATAM", label:"Saturday AM", dayOffset:0},
  {key:"SATPM", label:"Saturday PM", dayOffset:0},
  {key:"SUNAM", label:"Sunday AM", dayOffset:1}
];

let state = {
  tab: "register",
  roster: [],
  properties: [],
  sessionIndex: [],   // array of session ids
  sessions: {},        // id -> session object (cache)
  adminUnlocked: false,
  loaded: false,
  selectedRegName: ""
};

// ---------- storage helpers ----------
// ---------- storage backend ----------
// This app used to use Claude's window.storage, which requires viewers to be
// logged into Claude. It now talks to a free Google Apps Script Web App
// instead, so the register works for anyone with the link, no login needed.
// Deploy Code.gs as a Web App (see instructions in that file), then paste
// the resulting URL below.
const BACKEND_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

async function apiCall(action, payload){
  if(!BACKEND_URL || BACKEND_URL.indexOf("PASTE_YOUR") === 0){
    toast("Backend not configured yet — set BACKEND_URL in the code.");
    return null;
  }
  try{
    const res = await fetch(BACKEND_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(Object.assign({action}, payload))
    });
    return await res.json();
  }catch(e){
    console.error("backend call failed", action, payload, e);
    return null;
  }
}
async function sget(key){
  const r = await apiCall("get", {key});
  if(!r || r.value === null || r.value === undefined) return null;
  try{ return JSON.parse(r.value); }catch(e){ return null; }
}
async function sset(key, val){
  const r = await apiCall("set", {key, value: JSON.stringify(val)});
  return !!(r && r.ok);
}

function toast(msg, ms=2600){
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), ms);
}

function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso+"T12:00:00");
  return d.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
}

// Draw schedule: Sat AM draws Fri 7:00 PM (night before) · Sat PM & Sun AM draw Sat 2:00 PM.
// Registration for each session auto-closes 1 minute before its draw time.
function drawDateTime(s){
  const d = new Date(s.dateISO+"T12:00:00");
  if(s.day === "SATAM"){
    d.setDate(d.getDate()-1);
    d.setHours(19,0,0,0);
  } else if(s.day === "SATPM"){
    d.setHours(14,0,0,0);
  } else { // SUNAM — draws alongside Sat PM, the day before
    d.setDate(d.getDate()-1);
    d.setHours(14,0,0,0);
  }
  return d;
}
function registrationCloseTime(s){
  return new Date(drawDateTime(s).getTime() - 60*1000);
}
function isRegistrationOpen(s){
  if(!s.active) return false;
  if(s.order && s.order.length) return false;
  return new Date() < registrationCloseTime(s);
}
function fmtDateTime(d){
  return d.toLocaleString(undefined, {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
}

// ---------- init / seeding ----------
async function init(){
  let roster = await sget("roster");
  if(!roster){ roster = SEED_ROSTER.slice(); await sset("roster", roster); }
  else if(roster.length && typeof roster[0] === "string"){
    // migrate old plain-name format
    roster = roster.map(n => ({name:n, junior: JUNIOR_NAMES.has(n)}));
    await sset("roster", roster);
  }
  state.roster = roster;

  let props = await sget("properties");
  if(!props){ props = SEED_PROPERTIES.slice(); await sset("properties", props); }
  state.properties = props;

  let idx = await sget("session-index");
  if(!idx){ idx = []; await sset("session-index", idx); }
  state.sessionIndex = idx;

  let pin = await sget("admin-pin");
  if(!pin){ pin = "1919"; await sset("admin-pin", pin); }
  state.adminPin = pin;

  await loadAllSessions();
  state.loaded = true;
  render();
}

async function loadAllSessions(){
  for(const id of state.sessionIndex){
    if(!state.sessions[id]){
      const s = await sget("session:"+id);
      if(s) state.sessions[id] = s;
    }
  }
}
async function saveSession(s){
  state.sessions[s.id] = s;
  await sset("session:"+s.id, s);
}

function sessionsSorted(){
  return state.sessionIndex.map(id=>state.sessions[id]).filter(Boolean)
    .sort((a,b)=> a.dateISO===b.dateISO ? a.day.localeCompare(b.day) : a.dateISO.localeCompare(b.dateISO));
}
function sessionStatus(s){
  if(s.locked) return "locked";
  if(s.order && s.order.length) return "drawn";
  return s.active ? "open" : "closed";
}

// ---------- tabs ----------
document.addEventListener("click", (e)=>{
  const tabBtn = e.target.closest("[data-tab]");
  if(tabBtn){ state.tab = tabBtn.dataset.tab; render(); }
});

function render(){
  document.querySelectorAll(".tabbar button").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab === state.tab);
  });
  const titles = {register:"Register to Shoot", draw:"Live Draw", results:"Draw Results", setup:"Club Setup"};
  document.getElementById("topTitle").textContent = titles[state.tab] || "Field Register";

  if(!state.loaded){ return; }
  const view = document.getElementById("view");
  if(state.tab === "register") view.innerHTML = renderRegister();
  else if(state.tab === "draw") view.innerHTML = state.adminUnlocked ? renderDraw() : renderPinGate("draw");
  else if(state.tab === "results") view.innerHTML = renderResults();
  else if(state.tab === "setup") view.innerHTML = state.adminUnlocked ? renderSetup() : renderPinGate("setup");
  attachHandlers();
}

function renderPinGate(returnTab){
  return `
  <div class="card pin-gate">
    <h2>Admin PIN required</h2>
    <p class="muted">This area runs the draw and edits club data. Ask your club admin for the PIN.</p>
    <input type="text" inputmode="numeric" id="pinInput" maxlength="8" placeholder="••••">
    <div class="btn-row" style="justify-content:center">
      <button class="btn-primary" id="pinSubmit" data-return="${returnTab}">Unlock</button>
    </div>
  </div>`;
}

// ---------- REGISTER TAB ----------
function renderRegister(){
  const open = sessionsSorted().filter(isRegistrationOpen);
  const selectedName = state.selectedRegName || "";

  const rosterOpts = state.roster.slice().sort((a,b)=>a.name.localeCompare(b.name))
    .map(m=>`<option value="${escAttr(m.name)}" ${m.name===selectedName?"selected":""}>${esc(m.name)}${m.junior?" (Jr)":""}</option>`).join("");
  const hostOpts = rosterOpts;

  // Which of the currently open sessions has this shooter already registered for?
  const registeredIds = new Set();
  if(selectedName && selectedName !== "__guest__"){
    open.forEach(s => { if(s.registrations.includes(selectedName)) registeredIds.add(s.id); });
  }

  const byWeekend = {};
  open.forEach(s=>{ (byWeekend[s.weekendLabel] = byWeekend[s.weekendLabel] || []).push(s); });

  const groupsHtml = Object.keys(byWeekend).map(wk=>{
    const sess = byWeekend[wk].slice().sort((a,b)=>a.dateISO.localeCompare(b.dateISO));
    const remaining = sess.filter(s=>!registeredIds.has(s.id));

    if(selectedName && selectedName !== "__guest__" && remaining.length===0){
      return `<div class="weekend-group"><div class="session-option locked checked">
        <div class="meta"><div class="sday">${wk}</div><div class="sdate">You're registered for every open session this weekend.</div></div>
        <span class="tag tag-drawn">✓ All set</span>
      </div></div>`;
    }

    const selectAll = remaining.length > 1 ? `
      <label class="session-option select-all" data-weekend="${escAttr(wk)}">
        <input type="checkbox" class="selectAllCheck" data-weekend="${escAttr(wk)}">
        <div class="meta"><div class="sday">Select all ${remaining.length} remaining sessions — ${wk}</div><div class="sdate">Shooting the whole weekend</div></div>
      </label>` : "";

    const rows = sess.map(s=>{
      if(registeredIds.has(s.id)){
        return `<div class="session-option locked checked">
          <div class="meta">
            <div class="sday">${dayLabel(s.day)} · ${s.weekendLabel}</div>
            <div class="sdate">${fmtDate(s.dateISO)} · Closes ${fmtDateTime(registrationCloseTime(s))}</div>
          </div>
          <span class="tag tag-drawn">✓ Registered</span>
        </div>`;
      }
      return `<label class="session-option" data-session="${s.id}" data-weekend="${escAttr(wk)}">
        <input type="checkbox" class="regCheck" value="${s.id}">
        <div class="meta">
          <div class="sday">${dayLabel(s.day)} · ${s.weekendLabel}</div>
          <div class="sdate">${fmtDate(s.dateISO)} · ${s.registrations.length} registered · Closes ${fmtDateTime(registrationCloseTime(s))}</div>
        </div>
      </label>`;
    }).join("");
    return `<div class="weekend-group">${selectAll}${rows}</div>`;
  }).join("");

  return `
  <div class="card">
    <h2>Who's shooting?</h2>
    <label>Your name</label>
    <select id="regName">
      <option value="">— Select your name —</option>
      <option value="__guest__" ${selectedName==="__guest__"?"selected":""}>Guest / not on roster</option>
      ${rosterOpts}
    </select>
    <div id="guestFields" style="display:${selectedName==="__guest__"?"block":"none"}">
      <label>Guest name</label>
      <input type="text" id="guestName" placeholder="Full name">
      <label>Hosted by</label>

    ${open.length>0 ? `<div class="btn-row"><button class="btn-primary" id="submitReg" style="width:100%">Submit registration</button></div>` : ""}

function escAttr(s){ return String(s).replace(/"/g,'&quot;'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function syncSelectAll(weekend){
  if(!weekend) return;
  const all = document.querySelectorAll(`.session-option[data-session][data-weekend="${cssEsc(weekend)}"] input`);
  const master = document.querySelector(`.selectAllCheck[data-weekend="${cssEsc(weekend)}"]`);
  if(!master || all.length===0) return;
  master.checked = Array.from(all).every(i=>i.checked);
  master.closest(".select-all").classList.toggle("checked", master.checked);
}

async function submitRegistration(){
  const nameSel = document.getElementById("regName").value;
  let name = nameSel;
  if(nameSel === "__guest__"){
    const gname = document.getElementById("guestName").value.trim();
    const host = document.getElementById("guestHost").value;
    if(!gname || !host){ toast("Enter guest name and host to continue."); return; }
    name = `${gname.toUpperCase()} (Guest of ${host})`;
  } else if(!nameSel){
    toast("Select your name first.");
    return;
  }
  const checks = Array.from(document.querySelectorAll(".regCheck:checked")).map(c=>c.value);
  if(checks.length===0){ toast("Pick at least one session."); return; }

  for(const id of checks){
    const s = state.sessions[id];
    if(!s.registrations.includes(name)){
      s.registrations.push(name);
      await saveSession(s);
    }
  }
  toast(`Registered ${name.split(" (")[0]} for ${checks.length} session${checks.length>1?"s":""}.`);
  state.selectedRegName = "";
  render();
}

// ---------- DRAW TAB ----------
function renderDraw(){
  const sessions = sessionsSorted().filter(s=>!s.locked);
  const options = sessions.map(s=>`<option value="${s.id}">${dayLabel(s.day)} · ${s.weekendLabel} · ${fmtDate(s.dateISO)} (${s.registrations.length})</option>`).join("");
  const sel = state.drawSessionId && state.sessions[state.drawSessionId] ? state.sessions[state.drawSessionId] : (sessions[0]||null);
  if(sel) state.drawSessionId = sel.id;

  let body = `<div class="empty">No open sessions yet. Create one under Setup.</div>`;
  if(sel){
    const status = sessionStatus(sel);
    const drawn = !!(sel.order && sel.order.length);
    body = `
    <div class="stat-box">
      <div class="s"><div class="n">${sel.registrations.length}</div><div class="l">Registered</div></div>
      <div class="s"><div class="n">${drawn ? Object.keys(sel.assignments||{}).length : "—"}</div><div class="l">Assigned</div></div>
      <div class="s"><div class="n">${status}</div><div class="l">Status</div></div>
    </div>
    <div class="muted" style="margin-bottom:10px">Scheduled draw ${fmtDateTime(drawDateTime(sel))} · Registration ${isRegistrationOpen(sel)?"closes":"closed"} ${fmtDateTime(registrationCloseTime(sel))}</div>`;

    if(!drawn){
      body += `<div class="btn-row"><button class="btn-primary" id="runDraw" style="width:100%" ${sel.registrations.length===0?"disabled":""}>Run the draw (${sel.registrations.length} shooters)</button></div>`;
    } else {
      const taken = {}; // property -> Set of stand numbers used in this session
      Object.values(sel.assignments||{}).forEach(a=>{
        if(a && a.property){ (taken[a.property] = taken[a.property]||new Set()).add(a.stand); }
      });
      let sawJunior = false;
      body += sel.order.map((name,i)=>{
        const jr = isJuniorName(name);
        let divider = "";
        if(jr && !sawJunior){ divider = `<div class="section-divider">Junior members draw last</div>`; sawJunior = true; }
        const a = (sel.assignments||{})[name];
        if(a){
          return `${divider}<div class="ticket done">
            <div class="num">${i+1}</div>
            <div class="who"><div class="nm">${esc(name)}${jr?' <span class="tag tag-drawn">Jr</span>':''}</div><div class="as">${esc(a.property)} · Stand ${a.stand}</div></div>
            <button class="btn-ghost btn-small editAssign" data-name="${escAttr(name)}">Edit</button>
          </div>`;
        }
        const propOpts = state.properties.map(p=>`<option value="${escAttr(p.name)}">${esc(p.name)} (${p.stands})</option>`).join("");
        return `${divider}<div class="ticket" data-pending="${escAttr(name)}">
          <div class="num">${i+1}</div>
          <div class="who">
            <div class="nm">${esc(name)}${jr?' <span class="tag tag-drawn">Jr</span>':''}</div>
            <div class="assign-controls">
              <select class="propSel"><option value="">Property…</option>${propOpts}</select>
              <select class="standSel"><option value="">Stand…</option></select>
              <button class="btn-brass btn-small confirmAssign" data-name="${escAttr(name)}">Confirm</button>
            </div>
          </div>
        </div>`;
      }).join("");
      const allAssigned = sel.order.every(n => (sel.assignments||{})[n]);
      body += `<div class="btn-row">
        <button class="btn-ghost btn-small" id="reshuffle">Re-shuffle order</button>
        <button class="btn-primary" id="lockSession" ${allAssigned?"":"disabled"} style="flex:1">Lock session</button>
      </div>`;
      window.__taken = taken;
    }
  }

  return `
  <div class="card">
    <h2>Choose session</h2>
    ${sessions.length ? `<select id="drawSessionSel">${options}</select>` : `<div class="empty">No sessions available.</div>`}
  </div>
  <div class="card">${body}</div>`;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
async function runDraw(){
  const s = state.sessions[state.drawSessionId];
  if(!s || s.registrations.length===0) return;
  const ordinary = s.registrations.filter(n => !isJuniorName(n));
  const juniors  = s.registrations.filter(n => isJuniorName(n));
  const order = shuffle(ordinary).concat(shuffle(juniors));
  s.order = order;
  s.assignments = {};
  s.drawnAt = new Date().toISOString();
  await saveSession(s);
  toast("Draw order set.");
  render();
}
async function reshuffleDraw(){
  const s = state.sessions[state.drawSessionId];
  if(!s) return;
  if(Object.keys(s.assignments||{}).length > 0){
    if(!confirm("Some stands are already assigned. Re-shuffling clears all assignments. Continue?")) return;
  }
  await runDraw();
}
async function confirmAssign(name){
  const s = state.sessions[state.drawSessionId];
  const ticket = document.querySelector(`.ticket[data-pending="${cssEsc(name)}"]`);
  if(!ticket) return;
  const prop = ticket.querySelector(".propSel").value;
  const stand = ticket.querySelector(".standSel").value;
  if(!prop || !stand){ toast("Pick both a property and a stand."); return; }
  s.assignments = s.assignments || {};
  s.assignments[name] = {property: prop, stand: parseInt(stand,10)};
  await saveSession(s);
  render();
}
async function editAssign(name){
  const s = state.sessions[state.drawSessionId];
  delete s.assignments[name];
  await saveSession(s);
  render();
}
async function lockSession(){
  const s = state.sessions[state.drawSessionId];
  s.locked = true;
  s.active = false;
  await saveSession(s);
  toast("Session locked. Results are final.");
  state.tab = "results";
  render();
}
function cssEsc(s){ return String(s).replace(/(["\\])/g,'\\$1'); }

function renderResults(){

  const sel = state.resultsSessionId && state.sessions[state.resultsSessionId] ? state.sessions[state.resultsSessionId] : sessions[sessions.length-1];
  state.resultsSessionId = sel.id;
  const options = sessions.map(s=>`<option value="${s.id}" ${s.id===sel.id?"selected":""}>${s.day==='SATAM'?'Sat AM':s.day==='SATPM'?'Sat PM':'Sun AM'} · ${s.weekendLabel} · ${fmtDate(s.dateISO)}</option>`).join("");

  const rows = sel.order.map((name,i)=>{

    return `<tr><td>${i+1}</td><td>${esc(name)}</td><td>${a?esc(a.property):"—"}</td><td>${a?a.stand:"—"}</td></tr>`;
  }).join("");

}
function exportCsv(){
  const sel = state.sessions[state.resultsSessionId];
  if(!sel) return;
  let csv = "Order,Shooter,Property,Stand,Weekend,Day,Date\n";
  sel.order.forEach((name,i)=>{
    const a = (sel.assignments||{})[name] || {};
    csv += `${i+1},"${name.replace(/"/g,'""')}",${a.property||""},${a.stand||""},${sel.weekendLabel},${sel.day},${sel.dateISO}\n`;
  });
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${sel.weekendLabel}_${sel.day}_draw.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function createSessions(){
  const label = document.getElementById("newWeekendLabel").value.trim();
  const dateStr = document.getElementById("newWeekendDate").value;
  if(!label || !dateStr){ toast("Enter a weekend label and Saturday's date."); return; }
  const wantSatAM = document.getElementById("chkSatAM").checked;
  const wantSatPM = document.getElementById("chkSatPM").checked;
  const wantSunAM = document.getElementById("chkSunAM").checked;
  const picks = [];
  if(wantSatAM) picks.push({key:"SATAM", offset:0});
  if(wantSatPM) picks.push({key:"SATPM", offset:0});
  if(wantSunAM) picks.push({key:"SUNAM", offset:1});
  if(picks.length===0){ toast("Pick at least one session."); return; }

  for(const p of picks){
    const d = new Date(dateStr+"T12:00:00");
    d.setDate(d.getDate()+p.offset);
    const dISO = d.toISOString().slice(0,10);
    const id = `${label.replace(/[^a-z0-9]/gi,'').toLowerCase()}-${p.key.toLowerCase()}-${dISO}`;
    const session = {
      id, weekendLabel: label, day: p.key, dateISO: dISO,
      active: true, registrations: [], order: [], assignments: {}, drawnAt: null, locked: false
    };
    await saveSession(session);
    if(!state.sessionIndex.includes(id)) state.sessionIndex.push(id);
  }
  await sset("session-index", state.sessionIndex);
  toast(`Created ${picks.length} session(s) for ${label}.`);
  render();
}
async function toggleActive(id){
  const s = state.sessions[id];
  s.active = !s.active;
  await saveSession(s);
  render();
}
async function deleteSession(id){
  if(!confirm("Delete this session and its registrations? This can't be undone.")) return;
  state.sessionIndex = state.sessionIndex.filter(x=>x!==id);
  delete state.sessions[id];
  await sset("session-index", state.sessionIndex);
  render();
}
async function addMember(){
  const input = document.getElementById("newMemberName");
  const juniorChk = document.getElementById("newMemberJunior");
  const name = input.value.trim().toUpperCase();
  if(!name) return;
  if(!state.roster.find(m=>m.name===name)){
    state.roster.push({name, junior: juniorChk.checked});
    await sset("roster", state.roster);
  }
  input.value = "";
  juniorChk.checked = false;
  render();
}
async function removeMember(name){
  state.roster = state.roster.filter(m=>m.name!==name);
  await sset("roster", state.roster);
  render();
}
async function toggleJunior(name){
  const m = state.roster.find(r=>r.name===name);
  if(!m) return;
  m.junior = !m.junior;
  await sset("roster", state.roster);
  render();
}
async function addProp(){
  const nameInput = document.getElementById("newPropName");
  const standsInput = document.getElementById("newPropStands");
  const name = nameInput.value.trim().toUpperCase();
  const stands = parseInt(standsInput.value, 10);
  if(!name || !stands || stands<1){ toast("Enter a property name and stand count."); return; }
  const existing = state.properties.find(p=>p.name===name);
  if(existing) existing.stands = stands;
  else state.properties.push({name, stands});
  await sset("properties", state.properties);
  nameInput.value=""; standsInput.value="";
  render();
}
async function removeProp(name){
  state.properties = state.properties.filter(p=>p.name!==name);

}
async function savePin(){

function dayLabel(day){
  return day==='SATAM' ? 'Sat AM' : day==='SATPM' ? 'Sat PM' : 'Sun AM';
}
function buildWeeklyMessage(){
  const open = sessionsSorted().filter(s=>s.active && !(s.order&&s.order.length));
  if(open.length===0) return null;
  const byWeekend = {};
  open.forEach(s=>{ (byWeekend[s.weekendLabel] = byWeekend[s.weekendLabel] || []).push(s); });
  const lines = [`Trelawny Gun Club — Draw Registration`, ``];
  Object.keys(byWeekend).forEach(wk=>{
    const sess = byWeekend[wk].slice().sort((a,b)=>a.dateISO.localeCompare(b.dateISO));
    const parts = sess.map(s=>`${dayLabel(s.day)} (${fmtDate(s.dateISO)})`).join(' · ');
    lines.push(`${wk}: ${parts}`);
  });
  lines.push(``, `Tap below and let us know which sessions you're shooting:`, window.location.href, ``, `Registration closes once the draw is run for each session — don't wait!`);
  return lines.join('\n');
}
function fallbackCopy(text){
  const ta = document.getElementById("waMsgBox");
  if(ta){
    ta.focus(); ta.select();
    try{ document.execCommand('copy'); toast("Copied — paste into WhatsApp."); }
    catch(e){ toast("Couldn't auto-copy — tap the text above, select all, and copy manually."); }
  } else {
    toast("Couldn't auto-copy — tap the text above, select all, and copy manually.");
  }
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      ()=>toast("Copied — paste into WhatsApp."),
      ()=>fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}

async function downloadQr(){
  const img = document.getElementById('qrImg');
  if(!img) return;
  try{
    const resp = await fetch(img.src, {mode:'cors'});
    const blob = await resp.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objUrl; a.download = 'tgc-field-register-qr.png';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(objUrl);
  }catch(e){
    window.open(img.src, '_blank');
    toast('Opened the QR in a new tab — long-press or right-click to save it.');
  }
}

// ---------- event wiring ----------
function attachHandlers(){
  const regName = document.getElementById("regName");
  if(regName){
    regName.addEventListener("change", ()=>{
      state.selectedRegName = regName.value;
      render();
    });
  }
  document.querySelectorAll(".session-option[data-session]").forEach(opt=>{
    opt.addEventListener("click", (e)=>{
      if(e.target.tagName !== "INPUT"){
        const cb = opt.querySelector("input");
        cb.checked = !cb.checked;
      }
      opt.classList.toggle("checked", opt.querySelector("input").checked);
      syncSelectAll(opt.dataset.weekend);
    });
  });
  document.querySelectorAll(".selectAllCheck").forEach(cb=>{
    cb.addEventListener("click", (e)=> e.stopPropagation());
    cb.addEventListener("change", ()=>{
      const wk = cb.dataset.weekend;
      document.querySelectorAll(`.session-option[data-session][data-weekend="${cssEsc(wk)}"]`).forEach(opt=>{
        const input = opt.querySelector("input");
        input.checked = cb.checked;
        opt.classList.toggle("checked", cb.checked);
      });
    });
  });
  document.querySelectorAll(".select-all[data-weekend]").forEach(opt=>{
    opt.addEventListener("click", (e)=>{
      if(e.target.tagName !== "INPUT"){
        const cb = opt.querySelector("input");
        cb.checked = !cb.checked;
        cb.dispatchEvent(new Event("change"));
      }
      opt.classList.toggle("checked", opt.querySelector("input").checked);
    });
  });
  const submitReg = document.getElementById("submitReg");
  if(submitReg) submitReg.addEventListener("click", submitRegistration);

  const pinSubmit = document.getElementById("pinSubmit");
  if(pinSubmit){
    pinSubmit.addEventListener("click", ()=>{
      const val = document.getElementById("pinInput").value.trim();
      if(val === state.adminPin){ state.adminUnlocked = true; toast("Unlocked."); render(); }
      else toast("Incorrect PIN.");
    });
  }

  const drawSel = document.getElementById("drawSessionSel");
  if(drawSel) drawSel.addEventListener("change", ()=>{ state.drawSessionId = drawSel.value; render(); });
  const runDrawBtn = document.getElementById("runDraw");
  if(runDrawBtn) runDrawBtn.addEventListener("click", runDraw);
  const reshuffleBtn = document.getElementById("reshuffle");
  if(reshuffleBtn) reshuffleBtn.addEventListener("click", reshuffleDraw);
  const lockBtn = document.getElementById("lockSession");
  if(lockBtn) lockBtn.addEventListener("click", lockSession);

  document.querySelectorAll(".propSel").forEach(sel=>{
    sel.addEventListener("change", ()=>{
      const ticket = sel.closest(".ticket");
      const standSel = ticket.querySelector(".standSel");
      const propName = sel.value;
      const prop = state.properties.find(p=>p.name===propName);
      standSel.innerHTML = `<option value="">Stand…</option>`;
      if(prop){
        const takenSet = (window.__taken && window.__taken[propName]) || new Set();
        for(let i=1;i<=prop.stands;i++){
          if(!takenSet.has(i)) standSel.innerHTML += `<option value="${i}">${i}</option>`;
        }
      }
    });
  });
  document.querySelectorAll(".confirmAssign").forEach(btn=>{
    btn.addEventListener("click", ()=>confirmAssign(btn.dataset.name));
  });
  document.querySelectorAll(".editAssign").forEach(btn=>{
    btn.addEventListener("click", ()=>editAssign(btn.dataset.name));
  });

  const resultsSel = document.getElementById("resultsSessionSel");
  if(resultsSel) resultsSel.addEventListener("change", ()=>{ state.resultsSessionId = resultsSel.value; render(); });
  const exportBtn = document.getElementById("exportCsv");
  if(exportBtn) exportBtn.addEventListener("click", exportCsv);

  const createBtn = document.getElementById("createSessions");
  if(createBtn) createBtn.addEventListener("click", createSessions);
  document.querySelectorAll(".toggleActive").forEach(btn=>{
    btn.addEventListener("click", ()=>toggleActive(btn.dataset.id));
  });
  document.querySelectorAll(".deleteSession").forEach(btn=>{
    btn.addEventListener("click", ()=>deleteSession(btn.dataset.id));
  });
  const addMemberBtn = document.getElementById("addMember");
  if(addMemberBtn) addMemberBtn.addEventListener("click", addMember);
  document.querySelectorAll(".removeMember").forEach(btn=>{
    btn.addEventListener("click", ()=>removeMember(btn.dataset.name));
  });
  document.querySelectorAll(".toggleJunior").forEach(btn=>{
    btn.addEventListener("click", ()=>toggleJunior(btn.dataset.name));
  });
  const addPropBtn = document.getElementById("addProp");
  if(addPropBtn) addPropBtn.addEventListener("click", addProp);
  document.querySelectorAll(".removeProp").forEach(btn=>{
    btn.addEventListener("click", ()=>removeProp(btn.dataset.name));
  });
  const savePinBtn = document.getElementById("savePin");
  if(savePinBtn) savePinBtn.addEventListener("click", savePin);
  const copyWaBtn = document.getElementById("copyWaMsg");
  if(copyWaBtn) copyWaBtn.addEventListener("click", ()=>{
    const msg = buildWeeklyMessage();
    if(msg) copyText(msg);
  });
  const downloadQrBtn = document.getElementById("downloadQr");
  if(downloadQrBtn) downloadQrBtn.addEventListener("click", downloadQr);
}

init();
</script>
</body>
</html>
